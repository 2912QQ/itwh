<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网络设备运维平台</title>
<style>
:root{--bg:#050b16;--pn:rgba(10,20,38,.72);--bd:rgba(56,189,248,.22);--cy:#22d3ee;--gn:#22c55e;--rd:#ef4444;--tx:#d6e4f5;--mu:#7a8ba3;--mono:ui-monospace,"JetBrains Mono",Consolas,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:14px/1.5 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;background:radial-gradient(900px 500px at 15% -10%,rgba(34,211,238,.14),transparent 60%),radial-gradient(800px 500px at 100% 0,rgba(99,102,241,.16),transparent 60%),linear-gradient(rgba(56,189,248,.045) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,rgba(56,189,248,.045) 1px,transparent 1px) 0 0/40px 40px,var(--bg);background-attachment:fixed}
body::after{content:"";position:fixed;left:0;right:0;top:-120px;height:120px;pointer-events:none;background:linear-gradient(transparent,rgba(34,211,238,.07),transparent);animation:scan 7s linear infinite}
@keyframes scan{to{transform:translateY(calc(100vh + 240px))}}
header{display:flex;align-items:center;gap:12px;padding:12px 24px;background:rgba(5,11,22,.8);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5;box-shadow:0 1px 24px rgba(34,211,238,.08)}
.logo{width:26px;height:26px;border:2px solid var(--cy);border-radius:7px;position:relative;box-shadow:0 0 12px var(--cy),inset 0 0 8px rgba(34,211,238,.5);animation:glow 3s ease-in-out infinite}
.logo::after{content:"";position:absolute;inset:6px;background:var(--cy);border-radius:2px}
@keyframes glow{50%{box-shadow:0 0 22px var(--cy),inset 0 0 12px rgba(34,211,238,.8)}}
header h1{font-size:17px;margin:0;letter-spacing:2px;background:linear-gradient(90deg,#e0f2fe,var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
.sp{flex:1}.hud{font:12px var(--mono);color:var(--cy);opacity:.85}
button{background:linear-gradient(135deg,#0891b2,#4f46e5);color:#fff;border:0;border-radius:6px;padding:7px 14px;cursor:pointer;font-size:13px;box-shadow:0 0 12px rgba(34,211,238,.25);transition:.15s}
button:hover{box-shadow:0 0 20px rgba(34,211,238,.55);transform:translateY(-1px)}
button.g{background:rgba(34,211,238,.06);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
button.g:hover{border-color:var(--cy);color:var(--cy)}
button.d{background:linear-gradient(135deg,#dc2626,#9f1239)}button:disabled{opacity:.5;cursor:wait}
input,select{background:rgba(2,8,18,.7);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:8px 11px;font-size:13px;width:100%;outline:0;transition:.15s}
input:focus,select:focus{border-color:var(--cy);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
::placeholder{color:#52627a}
main{max-width:1180px;margin:0 auto;padding:22px}
.notice{border:1px solid rgba(251,191,36,.4);background:rgba(251,191,36,.08);color:#fcd34d;padding:10px 14px;border-radius:8px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{padding:12px 16px;border:1px solid var(--bd);border-radius:10px;background:var(--pn);backdrop-filter:blur(8px)}
.stat b{display:block;font:600 26px var(--mono);color:var(--c);text-shadow:0 0 14px var(--c)}
.stat span{color:var(--mu);font-size:12px;letter-spacing:1px}
h2{font:600 13px var(--mono);color:var(--cy);margin:24px 0 12px;letter-spacing:1px;display:flex;align-items:center;gap:10px}
h2::before{content:"//";opacity:.5}h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--bd),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{--st:#475569;position:relative;padding:14px 14px 14px 18px;border:1px solid var(--bd);border-radius:10px;background:var(--pn);backdrop-filter:blur(8px);cursor:pointer;transition:.18s;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--st);box-shadow:0 0 12px var(--st)}
.card.on{--st:var(--gn)}.card.off{--st:var(--rd)}
.card:hover{border-color:var(--cy);transform:translateY(-3px);box-shadow:0 8px 28px rgba(34,211,238,.18)}
.card b{display:flex;align-items:center;font-size:15px}
.card small{display:block;color:var(--mu);word-break:break-all}.card .ip{font:12px var(--mono);color:#93c5fd;margin-top:2px}
.tag{display:inline-block;font:11px var(--mono);color:var(--cy);border:1px solid var(--bd);border-radius:4px;padding:0 6px;margin:6px 4px 0 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#64748b;margin-right:8px;flex:none}
.dot.on{background:var(--gn);box-shadow:0 0 8px var(--gn);animation:pulse 2s infinite}.dot.off{background:var(--rd);box-shadow:0 0 8px var(--rd)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(34,197,94,0)}}
.login{position:relative;max-width:360px;margin:13vh auto 0;padding:30px;border:1px solid var(--bd);border-radius:14px;background:var(--pn);backdrop-filter:blur(14px);box-shadow:0 0 60px rgba(34,211,238,.12)}
.login::before,.login::after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--cy)}
.login::before{left:-1px;top:-1px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.login::after{right:-1px;bottom:-1px;border-left:0;border-top:0;border-radius:0 0 14px 0}
.login h1{font-size:19px;margin:6px 0 4px;text-align:center;letter-spacing:3px;color:#e0f2fe;text-shadow:0 0 16px var(--cy)}
.login .sub{text-align:center;font:11px var(--mono);color:var(--cy);opacity:.7;margin-bottom:20px}
.login input{margin-bottom:12px}.login button{width:100%;padding:10px;letter-spacing:4px}
.err{color:#fca5a5;min-height:20px;font-size:13px}
.panel{border:1px solid var(--bd);border-radius:12px;background:var(--pn);backdrop-filter:blur(8px);padding:18px;margin-bottom:16px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tabs .on{background:linear-gradient(135deg,#0891b2,#4f46e5);color:#fff;border:0}
table{width:100%;border-collapse:collapse}th{font:600 12px var(--mono);color:var(--cy);letter-spacing:1px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid rgba(56,189,248,.12);word-break:break-all}
td button{padding:3px 10px;margin-right:4px}.hide{display:none!important}
.mask{position:fixed;inset:0;background:rgba(2,6,14,.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:20}
.mask .login{margin:0;width:90%}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="login" class="login hide">
  <h1 id="ltitle">网络设备运维平台</h1>
  <div class="sub">SECURE ACCESS // 身份验证</div>
  <input id="u" placeholder="用户名" autocomplete="username">
  <input id="p" type="password" placeholder="密码" autocomplete="current-password">
  <div class="err" id="lerr"></div>
  <button id="lbtn">登 录</button>
</div>

<div id="app" class="hide">
  <header>
    <i class="logo"></i><h1 id="title"></h1><span class="sp"></span><span class="hud" id="clock"></span><span id="who" class="hud" style="color:var(--mu)"></span>
    <button class="g" id="refresh">刷新状态</button>
    <button class="g" id="toggle">后台管理</button>
    <button class="g" id="logout">退出</button>
  </header>
  <main>
    <div id="view-home">
      <div id="notice" class="notice hide"></div>
      <div class="stats" id="stats"></div>
      <input id="q" placeholder="搜索设备名称 / 地址 / 备注…" style="max-width:380px;margin-bottom:6px">
      <div id="list"></div>
    </div>

    <div id="view-admin" class="hide">
      <div class="tabs">
        <button class="on" data-t="dev">设备管理</button>
        <button class="g" data-t="set">站点设置</button>
        <button class="g" data-t="usr">用户管理</button>
        <button class="g" data-t="log">审计日志</button>
      </div>
      <div id="t-dev" class="panel">
        <div class="form">
          <input id="f-name" placeholder="设备名称 *"><input id="f-grp" placeholder="分组(如 核心机房)">
          <input id="f-type" placeholder="类型(交换机/防火墙…)">
          <select id="f-proto"><option>https</option><option>http</option><option>ssh</option><option>telnet</option><option>rdp</option></select>
          <input id="f-addr" placeholder="IP 或域名 *"><input id="f-port" placeholder="端口(可空)">
          <input id="f-note" placeholder="备注">
          <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="f-mon" checked style="width:auto">启用在线检测</label>
        </div>
        <button id="f-save">保存设备</button> <button class="g" id="f-reset">清空表单</button>
        <table style="margin-top:14px"><thead><tr><th>名称</th><th>分组</th><th>地址</th><th></th></tr></thead><tbody id="dev-rows"></tbody></table>
      </div>
      <div id="t-set" class="panel hide">
        <div class="form"><input id="s-title" placeholder="站点标题"><input id="s-notice" placeholder="首页公告(留空则不显示)"></div>
        <button id="s-save">保存设置</button>
      </div>
      <div id="t-usr" class="panel hide">
        <div class="form">
          <input id="n-user" placeholder="用户名"><input id="n-pass" type="password" placeholder="密码(至少8位)">
          <select id="n-role"><option value="viewer">只读用户</option><option value="admin">管理员</option></select>
        </div>
        <button id="n-save">添加 / 重置密码</button>
        <table style="margin-top:14px"><thead><tr><th>用户</th><th>角色</th><th></th></tr></thead><tbody id="usr-rows"></tbody></table>
      </div>
      <div id="t-log" class="panel hide">
        <table><thead><tr><th>时间</th><th>用户</th><th>操作</th><th>详情</th><th>来源IP</th></tr></thead><tbody id="log-rows"></tbody></table>
        <button class="g hide" id="log-more" style="margin-top:12px">加载更多</button>
      </div>
    </div>
  </main>
</div>

<div id="unlock" class="mask hide"><div class="login">
  <h1>管理员验证</h1><div class="sub">ADMIN ACCESS // 请再次输入密码</div>
  <input id="up" type="password" placeholder="当前账号密码" autocomplete="current-password">
  <div class="err" id="uerr"></div>
  <button id="ubtn">验 证</button>
  <button class="g" id="ucancel" style="margin-top:8px;letter-spacing:2px">取 消</button>
</div></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me,devices=[],settings={},editId=null;

async function api(path,method='GET',body){
  const r=await fetch('/api/'+path,{method,headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(r.status===401&&path!=='login'){showLogin();throw new Error('401')}
  if(r.status===403&&d.code==='LOCKED'){if(me)me.unlocked=false;lockUI();throw new Error(d.error)}
  if(!r.ok)throw new Error(d.error||'请求失败');
  return d;
}
function link(d){
  if(/^https?:\/\//i.test(d.address))return d.address;
  return `${d.protocol}://${d.address}${d.port?':'+d.port:''}`;
}
function showLogin(){$('app').classList.add('hide');$('login').classList.remove('hide')}
async function boot(){
  try{
    me=await api('me');settings=await api('settings');
    $('login').classList.add('hide');$('app').classList.remove('hide');
    $('who').textContent=`${me.u}(${me.role==='admin'?'管理员':'只读'})`;
    $('toggle').classList.toggle('hide',me.role!=='admin');
    applySettings();await loadDevices();
  }catch(e){showLogin()}
}
function applySettings(){
  const t=settings.title||'网络设备运维平台';
  document.title=t;$('title').textContent=t;$('ltitle').textContent=t;
  $('notice').textContent=settings.notice||'';$('notice').classList.toggle('hide',!settings.notice);
  $('s-title').value=settings.title||'';$('s-notice').value=settings.notice||'';
}
async function loadDevices(){devices=await api('devices');renderHome();renderRows()}

function renderHome(){renderStats();
  const q=$('q').value.trim().toLowerCase(),g={};
  devices.filter(d=>!q||[d.name,d.address,d.note,d.type,d.grp].join(' ').toLowerCase().includes(q))
    .forEach(d=>(g[d.grp]=g[d.grp]||[]).push(d));
  $('list').innerHTML=Object.keys(g).map(k=>`<h2>${esc(k)}</h2><div class="grid">`+g[k].map(d=>
    `<div class="card ${cls(d)}" data-id="${d.id}"><b>${dot(d)}${esc(d.name)}</b><small class="ip">${esc(d.address)}${d.port?':'+esc(d.port):''}</small><small>${stat(d)}</small>
     <span class="tag">${esc(d.protocol)}</span> ${d.type?`<span class="tag">${esc(d.type)}</span>`:''}
     ${d.note?`<small style="margin-top:6px">${esc(d.note)}</small>`:''}</div>`).join('')+'</div>').join('')||'<p style="color:var(--mu)">暂无设备</p>';
}
$('list').onclick=e=>{
  const c=e.target.closest('.card');if(!c)return;
  const d=devices.find(x=>x.id==c.dataset.id);
  if(d){api('open/'+d.id,'POST').catch(()=>{});window.open(link(d),'_blank','noopener');}
};
$('q').oninput=renderHome;

$('lbtn').onclick=async()=>{
  $('lerr').textContent='';
  try{await api('login','POST',{username:$('u').value.trim(),password:$('p').value});$('p').value='';boot()}
  catch(e){$('lerr').textContent=e.message}
};
$('p').onkeydown=e=>{if(e.key==='Enter')$('lbtn').click()};
$('logout').onclick=async()=>{await api('logout','POST').catch(()=>{});showLogin()};
let adminOpen=false;
function showAdmin(on){
  adminOpen=on;$('view-admin').classList.toggle('hide',!on);$('view-home').classList.toggle('hide',on);
  $('toggle').textContent=on?'返回首页':'后台管理';
  if(on)loadUsers().catch(()=>{});
}
function askUnlock(){$('up').value='';$('uerr').textContent='';$('unlock').classList.remove('hide');$('up').focus()}
function lockUI(){showAdmin(false);askUnlock()}
$('toggle').onclick=()=>{
  if(adminOpen){showAdmin(false);me.unlocked=false;api('admin/lock','POST').catch(()=>{});return}
  me.unlocked?showAdmin(true):askUnlock();
};
$('ubtn').onclick=async()=>{
  $('uerr').textContent='';
  try{await api('admin/unlock','POST',{password:$('up').value});me.unlocked=true;$('unlock').classList.add('hide');showAdmin(true)}
  catch(e){$('uerr').textContent=e.message}
};
$('up').onkeydown=e=>{if(e.key==='Enter')$('ubtn').click()};
$('ucancel').onclick=()=>$('unlock').classList.add('hide');
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.className='g');b.className='on';
  ['dev','set','usr','log'].forEach(t=>$('t-'+t).classList.toggle('hide',t!==b.dataset.t));
  if(b.dataset.t==='usr')loadUsers();
  if(b.dataset.t==='log'){logLast=0;$('log-rows').innerHTML='';loadLog()}
});

// 设备管理
const F=['name','grp','type','proto','addr','port','note'];
function renderRows(){
  $('dev-rows').innerHTML=devices.map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(d.grp)}</td><td>${esc(link(d))}</td>
   <td><button data-e="${d.id}">编辑</button><button class="d" data-x="${d.id}">删除</button></td></tr>`).join('');
}
function resetForm(){editId=null;F.forEach(k=>$('f-'+k).value=(k==='proto'?'https':''));$('f-mon').checked=true}
$('f-reset').onclick=resetForm;
$('f-save').onclick=async()=>{
  const b={name:$('f-name').value,grp:$('f-grp').value,type:$('f-type').value,protocol:$('f-proto').value,
    address:$('f-addr').value,port:$('f-port').value,note:$('f-note').value,monitor:$('f-mon').checked?1:0};
  try{editId?await api('devices/'+editId,'PUT',b):await api('devices','POST',b);resetForm();loadDevices()}
  catch(e){alert(e.message)}
};
$('dev-rows').onclick=async e=>{
  const id=e.target.dataset.e||e.target.dataset.x;if(!id)return;
  if(e.target.dataset.x){if(confirm('确定删除该设备?')){await api('devices/'+id,'DELETE');loadDevices()}return}
  const d=devices.find(x=>x.id==id);editId=id;
  $('f-name').value=d.name;$('f-grp').value=d.grp;$('f-type').value=d.type;$('f-proto').value=d.protocol;
  $('f-addr').value=d.address;$('f-port').value=d.port;$('f-note').value=d.note;$('f-mon').checked=!!d.monitor;scrollTo(0,0);
};
// 站点设置
$('s-save').onclick=async()=>{
  try{await api('settings','PUT',{title:$('s-title').value,notice:$('s-notice').value});
    settings=await api('settings');applySettings();alert('已保存')}catch(e){alert(e.message)}
};
// 用户管理
async function loadUsers(){
  if(me.role!=='admin')return;
  const us=await api('users');
  $('usr-rows').innerHTML=us.map(u=>`<tr><td>${esc(u.username)}</td><td>${u.role==='admin'?'管理员':'只读'}</td>
    <td>${u.username===me.u?'':`<button class="d" data-u="${esc(u.username)}">删除</button>`}</td></tr>`).join('');
}
$('n-save').onclick=async()=>{
  try{await api('users','POST',{username:$('n-user').value.trim(),password:$('n-pass').value,role:$('n-role').value});
    $('n-user').value=$('n-pass').value='';loadUsers()}catch(e){alert(e.message)}
};
$('usr-rows').onclick=async e=>{
  const u=e.target.dataset.u;
  if(u&&confirm('删除用户 '+u+'?')){await api('users/'+encodeURIComponent(u),'DELETE');loadUsers()}
};
// ---- 在线状态 ----
const dot=d=>`<i class="dot ${!d.monitor||d.status==null?'':d.status?'on':'off'}"></i>`;
const stat=d=>{
  if(!d.monitor)return '未启用检测';
  if(d.status==null)return '未检测';
  const t=d.checked_at?new Date(d.checked_at).toLocaleTimeString('zh-CN',{hour12:false}):'';
  return (d.status?`在线 ${d.latency}ms`:'离线')+' · '+t;
};
async function checkAll(){
  const b=$('refresh');b.disabled=true;b.textContent='检测中…';
  const q=devices.filter(d=>d.monitor);let i=0;
  const w=async()=>{while(i<q.length){const d=q[i++];try{Object.assign(d,await api('check/'+d.id,'POST'));renderHome()}catch(e){}}};
  await Promise.all([w(),w(),w(),w(),w()]);
  b.disabled=false;b.textContent='刷新状态';
}
$('refresh').onclick=checkAll;
setInterval(()=>{if(me&&!$('view-home').classList.contains('hide'))loadDevices().catch(()=>{})},60000);

// ---- 统计 / 时钟 ----
const cls=d=>!d.monitor||d.status==null?'':d.status?'on':'off';
function renderStats(){
  const m=devices.filter(d=>d.monitor),on=m.filter(d=>d.status===1).length,off=m.filter(d=>d.status===0).length;
  $('stats').innerHTML=[['设备总数',devices.length,'#22d3ee'],['在线',on,'#22c55e'],['离线',off,'#ef4444'],['未检测',devices.length-on-off,'#94a3b8']]
    .map(x=>`<div class="stat" style="--c:${x[2]}"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');
}
const tick=()=>{$('clock').textContent=new Date().toLocaleString('zh-CN',{hour12:false})};tick();setInterval(tick,1000);

// ---- 审计日志 ----
let logLast=0;
const ACT={login:'登录',login_fail:'登录失败',unlock:'后台验证',unlock_fail:'后台验证失败',logout:'退出',open_device:'打开设备',device_add:'新增设备',device_update:'修改设备',device_delete:'删除设备',settings_update:'修改设置',user_save:'添加/重置用户',user_delete:'删除用户'};
async function loadLog(){
  const r=await api('audit?limit=100'+(logLast?'&before='+logLast:''));
  $('log-rows').insertAdjacentHTML('beforeend',r.map(x=>`<tr><td>${new Date(x.ts).toLocaleString('zh-CN',{hour12:false})}</td><td>${esc(x.user)}</td><td>${esc(ACT[x.action]||x.action)}</td><td>${esc(x.detail)}</td><td>${esc(x.ip)}</td></tr>`).join(''));
  if(r.length)logLast=r[r.length-1].id;
  $('log-more').classList.toggle('hide',r.length<100);
}
$('log-more').onclick=loadLog;
boot();
</script>
</body>
</html>
